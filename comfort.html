<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>给你的温柔安慰</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: linear-gradient(160deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
    font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  canvas { display: block; position: fixed; top: 0; left: 0; }

  .main-text {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: #ffe0ec;
    z-index: 10;
    pointer-events: none;
    animation: breathe 4s ease-in-out infinite;
    padding: 0 24px;
    width: 100%;
  }
  .main-text h1 {
    font-size: clamp(22px, 6vw, 46px);
    font-weight: 300;
    letter-spacing: 0.15em;
    line-height: 1.6;
    text-shadow: 0 0 30px rgba(255,180,210,0.6);
  }
  .main-text p {
    font-size: clamp(13px, 3vw, 19px);
    margin-top: 22px;
    color: #c8d6ff;
    letter-spacing: 0.2em;
    opacity: 0.85;
    font-weight: 300;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.9; transform: translate(-50%,-50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%,-50%) scale(1.03); }
  }
  .hint {
    position: fixed;
    bottom: 36px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(200,214,255,0.5);
    font-size: 13px;
    letter-spacing: 0.3em;
    z-index: 10;
    pointer-events: none;
    animation: fadeInOut 3s ease-in-out infinite;
    white-space: nowrap;
  }
  @keyframes fadeInOut {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.8; }
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="main-text">
  <h1>你已经很努力了</h1>
  <p>没关系的，慢慢来，我陪着你</p>
</div>
<div class="hint">轻触屏幕，收下一点温暖</div>

<script>
(function() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let W, H;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const stars = [];
  function initStars() {
    stars.length = 0;
    for (let i = 0; i < 110; i++) {
      stars.push({
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() * 1.8 + 0.4,
        baseAlpha: Math.random() * 0.5 + 0.2,
        phase: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.015 + 0.005,
        hue: Math.random() < 0.6 ? 210 : 330
      });
    }
  }
  initStars();
  window.addEventListener('resize', initStars);

  const bubbles = [];
  function initBubbles() {
    bubbles.length = 0;
    for (let i = 0; i < 16; i++) {
      bubbles.push({
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() * 40 + 20,
        speedY: Math.random() * 0.3 + 0.1,
        driftX: Math.random() * 0.4 - 0.2,
        alpha: Math.random() * 0.06 + 0.03,
        hue: Math.random() < 0.5 ? 200 : 340
      });
    }
  }
  initBubbles();
  window.addEventListener('resize', initBubbles);

  const hearts = [];
  const warmWords = ['好啦好啦','今天天气不错','以后也是晴天','我想，你可以大胆说出你的不安','我并不会觉得你麻烦',
                     '忧郁小男孩儿','不许多想，只许开心','打不开的心结，系成是蝴蝶结不就好啦','你抬头看，碗面有大树、小花、小松鼠，这个世界亮晶晶的','我问小狗想太多怎么办，它说....汪汪汪','你想的多多的，嘴巴笨笨的',
                     'Good evening 好像从某人嘴里消失了','吴凡，你是大笨蛋','祝你每天都可以睡个好觉'];
  const heartColors = ['#ffb3c6','#ff8fab','#ffc2d1','#c8b6ff','#b8c0ff',
                       '#d0bfff','#a8dadc','#bde0fe','#ffd6e0'];

  function createHeartBurst(x, y) {
    const count = Math.floor(Math.random() * 6) + 8;
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 / count) * i + Math.random() * 0.8;
      const dist = Math.random() * 140 + 60;
      hearts.push({
        x: x, y: y,
        dx: Math.cos(angle) * dist,
        dy: Math.sin(angle) * dist - Math.random() * 60,
        rot: (Math.random() - 0.5) * 120,
        size: Math.random() * 16 + 12,
        color: heartColors[Math.floor(Math.random() * heartColors.length)],
        life: 1.0,
        decay: 0.008 + Math.random() * 0.006,
        isWord: Math.random() < 0.35,
        word: warmWords[Math.floor(Math.random() * warmWords.length)]
      });
    }
  }

  function animate() {
    const bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, 'rgba(26,26,46,1)');
    bg.addColorStop(0.4, 'rgba(22,33,62,1)');
    bg.addColorStop(1, 'rgba(15,52,96,1)');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    for (const b of bubbles) {
      b.y -= b.speedY; b.x += b.driftX;
      if (b.y + b.r < 0) { b.y = H + b.r; b.x = Math.random() * W; }
      if (b.x < -b.r) b.x = W + b.r;
      if (b.x > W + b.r) b.x = -b.r;
      const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
      g.addColorStop(0, `hsla(${b.hue},80%,75%,${b.alpha})`);
      g.addColorStop(0.5, `hsla(${b.hue},80%,65%,${b.alpha*0.5})`);
      g.addColorStop(1, `hsla(${b.hue},80%,60%,0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';

    ctx.globalCompositeOperation = 'lighter';
    for (const s of stars) {
      s.phase += s.speed;
      const alpha = s.baseAlpha + Math.sin(s.phase) * 0.25;
      if (alpha <= 0) continue;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${s.hue},80%,85%,${alpha})`;
      ctx.shadowColor = `hsla(${s.hue},90%,80%,${alpha})`;
      ctx.shadowBlur = 12;
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = 'source-over';

    for (let i = hearts.length - 1; i >= 0; i--) {
      const h = hearts[i];
      h.life -= h.decay;
      if (h.life <= 0.01) { hearts.splice(i,1); continue; }
      const progress = 1 - h.life;
      const ease = 1 - Math.pow(1 - progress, 3);
      const px = h.x + h.dx * ease;
      const py = h.y + h.dy * ease;
      ctx.save();
      ctx.globalAlpha = h.life;
      ctx.translate(px, py);
      ctx.rotate((h.rot * Math.PI / 180) * ease);
      if (h.isWord) {
        ctx.font = `${h.size}px 'Microsoft YaHei', sans-serif`;
        ctx.fillStyle = h.color;
        ctx.shadowColor = h.color;
        ctx.shadowBlur = 15;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(h.word, 0, 0);
      } else {
        ctx.fillStyle = h.color;
        ctx.shadowColor = h.color;
        ctx.shadowBlur = 18;
        const s = h.size / 16;
        ctx.beginPath();
        ctx.moveTo(0, 4*s);
        ctx.bezierCurveTo(-8*s, -4*s, -16*s, 4*s, 0, 14*s);
        ctx.bezierCurveTo(16*s, 4*s, 8*s, -4*s, 0, 4*s);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }
    requestAnimationFrame(animate);
  }
  animate();

  function handleInteraction(x, y) { createHeartBurst(x, y); }
  canvas.addEventListener('click', e => handleInteraction(e.clientX, e.clientY));
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0];
    handleInteraction(t.clientX, t.clientY);
  }, { passive: false });

  window.addEventListener('load', () => {
    setTimeout(() => createHeartBurst(W/2, H/2), 600);
  });
})();
</script>
</body>
</html>
